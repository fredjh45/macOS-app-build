name: Build macOS Application

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 playwright requests pyinstaller cryptography urllib3
          python -m playwright install --with-deps chromium

      - name: Build macOS App
        run: |
          pyinstaller GoogleSitesPoster_Mac.spec --clean --noconfirm

      - name: Package Release ZIP
        run: |
          mkdir -p dist/GoogleSitesPoster_macOS
          cp -R dist/GoogleSitesPoster.app dist/GoogleSitesPoster_macOS/
          cp -R images dist/GoogleSitesPoster_macOS/
          cd dist
          zip -r -y GoogleSitesPoster_macOS.zip GoogleSitesPoster_macOS

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleSitesPoster_macOS
          path: dist/GoogleSitesPoster_macOS.zip
